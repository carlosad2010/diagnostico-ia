<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14203A" />
    <meta name="description" content="Conversa con el Consultor de Diagnóstico de Studio-IA y descubre qué procesos de tu trabajo conviene mejorar o automatizar, con la solución más simple y el ahorro estimado." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=JetBrains+Mono:wght@500&family=Source+Sans+3:wght@400;600;700&display=swap" />
    <link rel="stylesheet" href="/styles.css" />
    <title>Diagnóstico de automatización · Studio-IA</title>
    <!-- Aplica el tema antes de pintar, para que no "parpadee" en claro -->
    <script>
      try {
        const saved = localStorage.getItem("theme");
        const prefersDark = matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = saved || (prefersDark ? "dark" : "light");
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <a class="saltar" href="#view">Ir al contenido</a>
    <nav class="app-nav" aria-label="Navegación principal">
      <div class="app-nav__inner">
        <a href="/inicio" class="app-nav__brand" data-link aria-label="Studio-IA, ir al inicio">
          <img src="/assets/logo-claro.png" alt="Studio-IA" width="127" height="30" />
        </a>
        <div class="app-nav__links">
          <a href="/inicio" class="app-nav__link" data-link>Inicio</a>
          <a href="/chat" class="app-nav__link" data-link>Diagnóstico</a>
          <a href="/como-funciona" class="app-nav__link" data-link>Cómo funciona</a>
          <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Activar modo oscuro">
            <svg class="theme-toggle__moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
            </svg>
            <svg class="theme-toggle__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
          </button>
        </div>
      </div>
    </nav>
    <main id="view" class="app" tabindex="-1"></main>
    <footer class="app-footer">
      <small>Studio-IA · Diagnóstico de procesos automatizables · Las cifras son estimaciones para priorizar</small>
    </footer>
    <script type="module" src="/app.js"></script>
  </body>
</html>
